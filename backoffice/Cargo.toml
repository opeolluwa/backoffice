[package]
default-run = "backoffice"
edition.workspace = true
name = "backoffice"
version = "0.1.0"

[workspace]
members = [
    "crates/backoffice-api",
    "crates/backoffice-cli",
    "crates/backoffice-config",
    "crates/backoffice-domain",
    "crates/backoffice-infra",
    "migration",
]
resolver = "2"

[workspace.package]
authors = ["Adefemi Adeoye"]
description = "Content management system and administrative platform for web applications"
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
askama = "0.15.6"
async-graphql-axum = "7.0"
axum = "0.8.3"
axum-extra = { version = "0.12.1", features = ["typed-header"] }
axum-test = "18.2.1"
axum_typed_multipart = { version = "0.16.3", features = ["tempfile_3"] }
backoffice-api = { path = "crates/backoffice-api" }
backoffice-cli = { path = "crates/backoffice-cli" }
backoffice-config = { path = "crates/backoffice-config" }
backoffice-domain = { path = "crates/backoffice-domain" }
backoffice-infra = { path = "crates/backoffice-infra" }
backoffice_macros = { path = "../backoffice_macros" }
base64 = "0.22"
bcrypt = "0.17.0"
chrono = { version = "0.4.41", features = ["serde"] }
clap = { version = "4.5.51", features = ["derive"] }
console = "0.16.1"
dialoguer = "0.12.0"
dotenv = "0.15.0"
fs_extra = "1.3.0"
jsonwebtoken = { version = "10.1.0", features = ["rust_crypto"] }
migration = { version = "0.1.0", path = "migration" }
mockall = "0.13"
reqwest = { version = "0.12", features = ["json", "multipart"] }
rust_decimal = { version = "1.39.0", features = ["macros", "serde"] }
sea-orm = { version = "=2.0.0-rc.37", features = [
    "runtime-tokio-rustls",
    "sqlx-postgres",
    "sqlx-sqlite",
    "macros",
    "debug-print",
    "seaography",
    "rbac",
    "with-time",
    "with-rust_decimal",
    "with-uuid",
] }
sea-orm-migration = { version = "=2.0.0-rc.37", features = ["runtime-tokio-rustls", "sqlx-postgres", "sqlx-sqlite"] }
seaography = { version = "=2.0.0-rc.8", features = [
    "graphql-playground",
    "with-decimal",
    "with-chrono",
    "with-uuid",
    "with-postgres-array",
] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["raw_value"] }
serde_with = "3.16.0"
sqlx = { version = "=0.8", features = [
    "runtime-tokio",
    "postgres",
    "sqlite",
    "macros",
    "migrate",
    "chrono",
    "time",
    "rust_decimal",
] }
thiserror = "2.0.12"
tokio = { version = "1.44.2", features = ["full", "macros"] }
tower = { version = "0.5.2", features = ["limit", "timeout"] }
tower-http = { version = "0.6.6", features = ["limit", "fs", "trace", "cors", "timeout", "sensitive-headers", "request-id"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "11.1.0", features = [
    "uuid-impl",
    "chrono-impl",
    "format",
    "serde-json-impl",
    "bigdecimal-impl",
] }
ulid = { version = "1.2.1", features = ["serde"] }
validator = { version = "0.20.0", features = ["derive"] }

[lib]
name = "backoffice_lib"
path = "src/lib.rs"

[dependencies]
axum.workspace = true
backoffice-api = { workspace = true }
backoffice-cli = { workspace = true }
backoffice-config = { workspace = true }
backoffice-domain = { workspace = true }
backoffice-infra = { workspace = true }
migration.workspace = true
secrecy.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
ulid.workspace = true

[build-dependencies]
fs_extra.workspace = true

[dev-dependencies]
axum = { workspace = true, features = ["macros"] }
axum-test.workspace = true
sea-orm.workspace = true
secrecy.workspace = true
serde_json.workspace = true

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = "debuginfo"
