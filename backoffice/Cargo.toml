[package]
name = "backoffice"
version = "0.1.0"
authors = ["Adefemi Adeoye"]
description = "Content management system and administrative platform for web applications"
edition = "2024"
default-run = "backoffice"

[lib]
name = "backoffice_lib"
path = "src/lib.rs"

[dependencies]
askama = "0.15.6"
async-graphql = "7.0"
async-graphql-axum = "7.0"
axum = { version = "0.8.3", features = ["macros"] }
axum-extra = { version = "0.12.1", features = ["typed-header"] }
axum_typed_multipart = { version = "0.16.3", features = ["tempfile_3"] }
backoffice_macros = { version = "0.1.0", path = "../backoffice_macros" }
base64 = "0.22"
bcrypt = "0.17.0"
bullmq-official = "1.1.0"
chrono = { version = "0.4.41", features = ["serde"] }
clap = { version = "4.5.51", features = ["derive"] }
console = "0.16.1"
dialoguer = "0.12.0"
jsonwebtoken = { version = "10.1.0", features = ["rust_crypto"] }
lettre = { version = "0.11.22", features = ["ring", "rustls", "rustls-native-certs"] }
log = "0.4.27"
migration = { version = "0.1.0", path = "migration" }
redis = "1.4.1"
reqwest = { version = "0.12", features = ["json", "multipart"] }
rust_decimal = { version = "1.39.0", features = ["macros", "serde"] }
sanitizer = { version = "1.0.0", features = ["derive"] }
sea-orm = { version = "=2.0.0-rc.37", features = [
    "runtime-tokio-rustls",
    "sqlx-postgres",
    "sqlx-sqlite",
    "macros",
    "debug-print",
    "seaography",
    "rbac",
    "with-time",
    "with-rust_decimal",
    "with-uuid",
] }
sea-orm-migration = { version = "=2.0.0-rc.37", features = ["runtime-tokio-rustls", "sqlx-postgres"] }
seaography = { version = "=2.0.0-rc.8", features = [
    "graphql-playground",
    "with-decimal",
    "with-chrono",
    "with-uuid",
    "with-postgres-array",
    "field-camel-case",
    "serde",
] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["raw_value"] }
serde_with = "3.16.0"
tempfile = "3.23.0"
thiserror = "2.0.12"
tokio = { version = "1.44.2", features = ["full", "macros"] }
tower = { version = "0.5.2", features = ["limit", "timeout"] }
tower-http = { version = "0.6.6", features = ["limit", "fs", "trace", "cors", "timeout", "sensitive-headers", "request-id"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "11.1.0", features = [
    "uuid-impl",
    "chrono-impl",
    "format",
    "serde-json-impl",
    "bigdecimal-impl",
] }
ulid = { version = "1.2.1", features = ["serde"] }
url = "2.5"
uuid = { version = "1.24.0", features = ["v4"] }
validator = { version = "0.20.0", features = ["derive"] }

[dev-dependencies]
axum-test = "18.2.1"
mockall = "0.13"
sea-orm = { version = "=2.0.0-rc.37", features = ["sqlx-sqlite"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde_json = "1.0.140"
tokio = { version = "1.44.2", features = ["full", "macros"] }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = "debuginfo"
