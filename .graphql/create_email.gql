mutation sendEmail {
    send_email(
        input: {
            subject: "Welcome to Backoffice"
            body: "Hello John,\n\nWelcome to Backoffice! We're excited to have you on board."
            sender_email: "noreply@backoffice.com"
            recipient_email: "john.doe@example.com"
            tag: "welcome"
            has_attachments: false
        }
    ) {
        identifier
        subject
        body
        senderEmail
        recipientEmail
        tag
        hasAttachments
    }
}



